name: Marketing Data Platform - dbt CI

on:
  pull_request:
    branches:
      - beejan
    paths:
      - "dbt_project/cde_marketing-data-platform/cde_marketing/**"
      - ".github/workflows/dbt_ci.yml"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt_project/cde_marketing-data-platform/cde_marketing

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_CI_TOKEN: ${{ secrets.DBT_CI_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt and Databricks adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-databricks==1.12.6"

      - name: Install dbt packages
        run: dbt deps --profiles-dir ci_config

      - name: Validate Databricks connection
        run: dbt debug --target ci --profiles-dir ci_config

      - name: Run dbt CI build
        run: dbt build --target ci --profiles-dir ci_config