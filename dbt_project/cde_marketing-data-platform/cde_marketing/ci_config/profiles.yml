cde_databricks_connection:
  target: ci
  outputs:
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_CI_TOKEN') }}"
      catalog: cde_marketing_ci
      schema: marketing
      threads: 3