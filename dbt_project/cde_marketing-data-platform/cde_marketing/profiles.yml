cde_databricks_connection:
  target: dev

  outputs:
    dev:
      type: databricks

      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DEV_TOKEN') }}"

      catalog: cde_marketing_development
      schema: marketing
      threads: 3

    ci:
      type: databricks

      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_CI_TOKEN') }}"

      catalog: cde_marketing_ci
      schema: marketing
      threads: 3

    prod:
      type: databricks

      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_PROD_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_PROD_CLIENT_SECRET') }}"

      catalog: cde_marketing_production
      schema: marketing
      threads: 3